services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techsupport
      POSTGRES_PASSWORD: techsupport
      POSTGRES_DB: techsupport
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techsupport -d techsupport"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/attachments || true &&
      mc mb -p local/agent-handbooks || true &&
      exit 0
      "

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # Apple Silicon (M4) + Docker Desktop: JVM SIGILL without this (OpenJDK 21.0.6 SVE bug)
      JAVA_OPTS_APPEND: "-XX:UseSVE=0"
      JAVA_TOOL_OPTIONS: "-XX:UseSVE=0"
    ports:
      - "8081:8080"
    volumes:
      - ./config/keycloak/tech-support-realm.json:/opt/keycloak/data/import/tech-support-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_ENV: development
      # Apple Silicon + Docker Desktop <4.39: OpenSSL probes ARM CPU features and
      # enables instructions that fault (SIGILL) under virtualization. Disable the
      # capability probe. Harmless/ignored on amd64. Remove once on Docker Desktop 4.39+.
      OPENSSL_armcap: "0"
      DATABASE_URL: postgresql+asyncpg://techsupport:techsupport@postgres:5432/techsupport
      DATABASE_URL_SYNC: postgresql://techsupport:techsupport@postgres:5432/techsupport
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:5174","http://127.0.0.1:5174"]'
      GRAPH_ENABLED: "true"
      GRAPH_LLM_MODE: ${GRAPH_LLM_MODE:-openai}
      QDRANT_URL: http://qdrant:6333
      # KB handbook object storage. Prod uses Ceph RGW; locally we reuse the
      # MinIO service (S3-compatible) so uploads survive API restarts.
      KB_HANDBOOK_STORAGE_BACKEND: s3
      KB_HANDBOOK_S3_BUCKET: agent-handbooks
      CEPH_RGW_ENDPOINT: http://minio:9000
      CEPH_RGW_ACCESS_KEY: minioadmin
      CEPH_RGW_SECRET_KEY: minioadmin
      CEPH_RGW_ADDRESSING_STYLE: path
      KEYCLOAK_URL: http://localhost:8081
      KEYCLOAK_REALM: tech-support
      KEYCLOAK_ADMIN_CLIENT_ID: tech-support-admin
      KEYCLOAK_API_AUDIENCE: tech-support-admin
      # JWKS fetch from inside the Compose network (browser still uses localhost:8081)
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/tech-support/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
      # Browser on host calls published API port (avoids in-container proxy issues)
      VITE_API_BASE_URL: http://localhost:8000
      VITE_THOUGHT_STREAMING_ENABLED: ${VITE_THOUGHT_STREAMING_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    ports:
      - "5174:5174"
    environment:
      API_PROXY_TARGET: http://api:8000
      # Browser-facing values (Keycloak realm redirect URIs are localhost:5174)
      VITE_KEYCLOAK_URL: http://localhost:8081
      VITE_KEYCLOAK_REALM: tech-support
      VITE_KEYCLOAK_CLIENT_ID: tech-support-admin
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  docs:
    build:
      context: .
      dockerfile: infra/docker/docs.Dockerfile
    ports:
      - "8088:8088"
    volumes:
      - ./docs:/app/docs:ro
      - ./mkdocs.yml:/app/mkdocs.yml:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
