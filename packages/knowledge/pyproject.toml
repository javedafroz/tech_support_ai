[project]
name = "tech-support-knowledge"
version = "0.1.0"
description = "Agent Handbook KB — ingest, retrieve, Qdrant store, Docling PDF→Markdown"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "tech-support-storage",
  "pydantic>=2.10.0",
  "qdrant-client>=1.12.0",
  "httpx>=0.28.0",
  "openai>=1.50.0",
]

[project.optional-dependencies]
docling = [
  "docling>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_support_knowledge"]
